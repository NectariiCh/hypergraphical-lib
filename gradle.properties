org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# The Gradle daemon runs on JDK 21 (Stonecutter needs it), pinned by
# gradle/gradle-daemon-jvm.properties. Each node compiles with its own toolchain:
# Java 17 for 1.20.1-forge, Java 21 for 1.21.1-neoforge.

## Mod metadata (consumed by the build scripts and mods.toml token replacement).
## Loader and dependency versions differ per node and live in stonecutter.properties.toml.
mod_id=hypergraphical
mod_name=Hypergraphical Lib
mod_version=0.1.0
mod_group=dev.nectariich.hypergraphical
mod_authors=nectariich
mod_license=MIT
mod_description=Unity-style runtime model rendering for Minecraft: true .obj loading, PBR materials with tiling/offset, emissive maps, metallic/smoothness and real cubemap reflection probes. Renders at arbitrary world coordinates.

## Optional. Set dev_with_oculus=true to also load the shader mod in runClient (Oculus on
## 1.20.1, Iris on 1.21.1), which is how the shader-pack code path (probe downgrade, stage
## overrides) gets exercised. Off by default: it doubles the third-party mixin surface in the
## dev environment for no benefit unless you are actually testing that path.
dev_with_oculus=false
