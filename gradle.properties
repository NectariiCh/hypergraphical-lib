org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ForgeGradle 6 requires the Gradle daemon itself to run on Java 17.
# Machine-specific: point this at a JDK 17 install (see README).
org.gradle.java.home=C:/Program Files/Java/jdk-17

## Mod metadata (consumed by build.gradle and mods.toml token replacement)
mod_id=hypergraphical
mod_name=Hypergraphical Lib
mod_version=0.1.0
mod_group=dev.nectariich.hypergraphical
mod_authors=nectariich
mod_license=MIT
mod_description=Unity-style runtime model rendering for Minecraft: true .obj loading, PBR materials with tiling/offset, emissive maps, metallic/smoothness and real cubemap reflection probes. Renders at arbitrary world coordinates.

## Toolchain
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Hard runtime dependency. embeddium_version is the exact build loaded into the dev run;
## embeddium_version_range is what mods.toml requires of users.
embeddium_version=0.3.31+mc1.20.1
embeddium_version_range=[0.3,)

## Optional. Set dev_with_oculus=true to also load Oculus in runClient, which is how the
## shader-pack code path (probe downgrade, stage overrides) gets exercised. Off by default:
## it doubles the third-party mixin surface in the dev environment for no benefit unless you
## are actually testing that path.
oculus_version=1.20.1-1.8.0
oculus_version_range=[1.6,)
dev_with_oculus=false
